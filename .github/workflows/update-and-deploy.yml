name: Update Thai jobs and deploy

on:
  schedule:
    # 00:00 UTC is 08:00 in Asia/Shanghai.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh public job data
        run: python3 outputs/scraper.py --output outputs/data/jobs.json

      - name: Refresh public-sector positions
        run: python3 outputs/public-sector/scraper.py outputs/public-sector/data.js

      - name: Commit refreshed data
        run: |
          git config user.name "thai-job-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add outputs/data/jobs.json outputs/public-sector/data.js
          git diff --cached --quiet || git commit -m "chore: refresh Thai jobs"
          git push || true

      - name: Build static site
        run: |
          mkdir -p _site/data
          mkdir -p _site/public-sector
          cp outputs/index.html outputs/styles.css outputs/app.js outputs/seed.js outputs/manifest.webmanifest _site/
          cp outputs/data/jobs.json _site/data/jobs.json
          cp outputs/public-sector/index.html outputs/public-sector/styles.css outputs/public-sector/app.js outputs/public-sector/data.js outputs/public-sector/manifest.webmanifest _site/public-sector/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
